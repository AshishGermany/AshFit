<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>AshFit</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div id="nav">
      <button onclick="showTracker()">Tracker</button>
      <button onclick="showLibrary()">Food Library</button>
    </div>

    <!-- SCREEN 1: TRACKER -->
    <div id="trackerScreen">
      <div class="app-header">
        <h1>AshFit</h1>
        <div class="version">v0.3.5 Alpha</div>
      </div>
      <div id="stats">
        <div class="statCard">
          <div class="statLabel">Calories</div>

          <div class="statValue">
            <span id="calories">0</span>
          </div>

          <div class="statUnit">kcal</div>
        </div>

        <div class="statCard">
          <div class="statLabel">Protein</div>

          <div class="statValue">
            <span id="protein">0</span>
          </div>

          <div class="statUnit">g</div>
        </div>
      </div>
      <h3>Favorites</h3>
      <div id="favoritesBar"></div>
      <h3>🔥 Frequently Used</h3>
      <div id="frequentBar"></div>
      <h3>Quick Meals</h3>
      <button onclick="addFood('work breakfast')">Work Breakfast</button>
      <button onclick="addFood('daily breakfast')">Daily Breakfast</button>

      <br /><br />

      <input type="text" id="input" placeholder="Type food..." />
      <div class="suggestions" id="suggestions"></div>

      <button onclick="addFood()">Add</button>
      <button onclick="undoLast()">Undo Last</button>
      <button onclick="resetDay()">Reset Day</button>

      <div class="log" id="log"></div>
    </div>

    <!-- SCREEN 2: FOOD LIBRARY -->
    <div id="libraryScreen" style="display: none">
      <h3>Add Food</h3>
      <input id="foodSearch" placeholder="Search food..." />
      <div id="foodFilters">
        <button onclick="filterFoods('All')">All</button>

        <button onclick="filterFoods('Protein')">Protein</button>

        <button onclick="filterFoods('Dairy')">Dairy</button>

        <button onclick="filterFoods('Drinks')">Drinks</button>

        <button onclick="filterFoods('Snacks')">Snacks</button>
      </div>
      <br />
      <input id="foodName" placeholder="Food name" />

      <input id="foodCal" placeholder="Calories" />

      <input id="foodProtein" placeholder="Protein" />

      <br />

      <label for="foodType"> Type </label>

      <select id="foodType">
        <option value="food">Food</option>

        <option value="drink">Drink</option>
      </select>

      <label for="foodCategory"> Category </label>

      <select id="foodCategory">
        <option value="Protein">Protein</option>
        <option value="Dairy">Dairy</option>
        <option value="Drinks">Drinks</option>
        <option value="Bakery">Bakery</option>
        <option value="Snacks">Snacks</option>
        <option value="Fruit">Fruit</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Ready Meals">Ready Meals</option>
        <option value="Condiments">Condiments</option>
        <option value="Other">Other</option>
      </select>

      <br />
      <label for="foodMode">Mode</label>

      <select id="foodMode">
        <option value="unit">Per Unit</option>
        <option value="grams">Per 100 g</option>
      </select>

      <label id="edibleLabel" for="foodEdible" style="display: none">
        Edible Portion %
      </label>

      <input
        id="foodEdible"
        type="number"
        value="100"
        min="1"
        max="100"
        style="display: none"
      />

      <br />
      <label>
        Favourite
        <input type="checkbox" id="foodFavourite" />
      </label>

      <button onclick="addNewFood()">Add Food</button>

      <!--<h3>Food Library</h3>-->

      <div id="foodLibrary"></div>
    </div>

    <!-- SCRIPTS (ALWAYS AT END) -->
    <script src="foods.js"></script>
    <script src="data.js"></script>
    <script src="ui.js"></script>
    <script src="nutrition.js"></script>
    <script src="app.js"></script>
  </body>
</html>
